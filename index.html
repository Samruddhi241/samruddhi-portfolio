<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Samruddhi Kapadnis | AI &amp; Data Science Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--text:#ecebf7;--mute:#a3a1bd;--v:#8b5cf6;--b:#3b82f6;--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--grad:linear-gradient(120deg,#8b5cf6,#3b82f6);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:84px;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;line-height:1.65;overflow-x:hidden}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;margin:0;line-height:1.15}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.38}
.o1{width:520px;height:520px;background:var(--v);top:-120px;left:-120px;animation:drift 18s ease-in-out infinite alternate}
.o2{width:480px;height:480px;background:var(--b);bottom:-140px;right:-120px;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(90px,70px) scale(1.15)}}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
section{padding:96px 0}
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;padding:12px 0;transition:.3s}
.nav.s{background:rgba(0,0,0,.6);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between}
.logo{font-family:Sora;font-weight:800;font-size:1.15rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.links{display:flex;gap:4px}
.links a{padding:8px 14px;border-radius:99px;color:var(--mute);font-size:.92rem;transition:.25s}
.links a:hover,.links a.on{color:#fff;background:var(--glass);box-shadow:inset 0 0 0 1px var(--line)}
.burger{display:none;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.hero{min-height:100vh;display:flex;align-items:center;padding-top:110px}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:48px;align-items:center}
.hi{color:var(--mute);margin-bottom:12px}
h1{font-size:clamp(2.6rem,7vw,4.8rem);font-weight:800;letter-spacing:-.03em}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font-family:Sora;font-size:clamp(1.15rem,2.6vw,1.6rem);margin:18px 0;min-height:2.2em}
.cur{display:inline-block;width:3px;height:1.1em;background:var(--b);margin-left:4px;vertical-align:-3px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.lead{color:var(--mute);max-width:560px}
.btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
.btn{padding:13px 26px;border-radius:99px;font-weight:600;border:1px solid var(--line);background:var(--glass);transition:.25s;display:inline-block}
.btn.p{background:var(--grad);border:0;box-shadow:0 8px 30px rgba(139,92,246,.4)}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(59,130,246,.45)}
.avatar{aspect-ratio:1;max-width:340px;margin:auto;width:100%;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px)}
.avatar::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(139,92,246,.55);animation:spin 26s linear infinite}
.avatar::after{content:"";position:absolute;inset:-34px;border-radius:50%;border:1px solid rgba(59,130,246,.35);animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar span{font-family:Sora;font-weight:800;font-size:5.5rem;letter-spacing:-.05em}
.head{margin-bottom:44px}
.head h2{font-size:clamp(2rem,4.5vw,2.9rem);font-weight:700;letter-spacing:-.02em}
.head p{color:var(--mute);margin:10px 0 0;max-width:560px}
.head i{display:block;width:64px;height:4px;border-radius:4px;background:var(--grad);margin-top:16px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(16px);transition:.3s}
.glass.hv:hover{transform:translateY(-6px);border-color:rgba(139,92,246,.6);box-shadow:0 18px 50px rgba(139,92,246,.22)}
.about{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
.about .glass{padding:32px}
.about h3{font-size:1.15rem;margin-bottom:14px}
.about p{color:var(--mute);margin:0}
.ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.ul li{color:var(--mute);padding-left:22px;position:relative}
.ul li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--grad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;align-items:start}
.card{padding:26px;text-align:left;width:100%;display:block}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ch h3{font-size:1.1rem}
.plus{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--grad);transition:transform .3s}
.open .plus{transform:rotate(45deg)}
.exp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.open .exp{grid-template-rows:1fr}
.exp>div{overflow:hidden}
.exp p{color:var(--mute);margin:14px 0 0;font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tag{padding:5px 13px;border-radius:99px;font-size:.82rem;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.35)}
.sub{color:var(--mute);font-size:.9rem;margin-top:6px}
.pc h3{font-size:1.25rem;margin:6px 0 10px}
.pc p{color:var(--mute);margin:0;font-size:.95rem}
.date{display:inline-block;font-size:.8rem;color:#c4b5fd;background:rgba(139,92,246,.14);padding:4px 12px;border-radius:99px}
.more{margin-top:18px;font-weight:600;color:#a5b4fc}
.edu{max-width:760px;padding:36px;display:flex;gap:26px;align-items:center}
.cap{flex:none;width:76px;height:76px;border-radius:20px;background:var(--grad);display:grid;place-items:center;font-size:2.1rem;box-shadow:0 10px 34px rgba(139,92,246,.45)}
.edu h3{font-size:1.4rem}
.edu p{margin:6px 0 0;color:var(--mute)}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.ct{padding:30px;display:block}
.ct b{font-family:Sora;font-size:1.1rem;display:block;margin-bottom:6px}
.ct span{color:var(--mute);word-break:break-all;font-size:.95rem}
.ci{width:48px;height:48px;border-radius:14px;background:var(--grad);display:grid;place-items:center;margin-bottom:18px;font-weight:800}
footer{text-align:center;color:var(--mute);padding:36px 24px;border-top:1px solid var(--line);font-size:.9rem}
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;animation:fi .25s}
.md{width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:34px;background:rgba(18,12,36,.85);animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes fi{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(20px)}}
.md h3{font-size:1.5rem;margin:12px 0}
.md h4{margin:22px 0 8px;font-family:Sora}
.x{float:right;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass)}
.x:hover{background:var(--grad)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media(max-width:820px){
.hero .wrap,.about{grid-template-columns:1fr}
.avatar{max-width:230px;order:-1}.avatar span{font-size:3.8rem}
.burger{display:block}
.links{position:absolute;top:100%;left:16px;right:16px;flex-direction:column;background:rgba(10,6,22,.95);border:1px solid var(--line);border-radius:18px;padding:10px;display:none}
.links.m{display:flex}
.edu{flex-direction:column;align-items:flex-start}
section{padding:72px 0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<script>
const {useState,useEffect,useRef}=React;
const html=htm.bind(React.createElement);

const GITHUB="https://github.com/Samruddhi241";
const LINKEDIN="https://www.linkedin.com/in/samruddhi-kapadnis-2b1128296";
const EMAIL="samruddhikapadnis02@gmail.com";

const NAV=["Home","About","Skills","Projects","Education","Certifications","Contact"];
const ROLES=["AI & Data Science Undergraduate","Software Development Enthusiast","Data Analytics Learner","Cloud Computing Explorer"];

const SKILLS=[
 {t:"Programming Languages",i:["Python","C++"],d:"Languages I use to build projects and solve problems."},
 {t:"Core Concepts",i:["OOP","DBMS","OS","Computer Networks"],d:"Computer science fundamentals from my degree."},
 {t:"AI / ML",i:["Machine Learning (Fundamentals)"],d:"Foundations of machine learning, applied in my projects."},
 {t:"Data & Analytics",i:["Data Analysis","Data Visualization"],d:"Turning raw data into clear insights and dashboards."},
 {t:"Tools & Technologies",i:["Power BI","Tableau","Excel","Git","GitHub"],d:"Tools for analysis, reporting and version control."},
 {t:"Databases",i:["MySQL","MongoDB"],d:"Relational and document databases for application data."},
 {t:"Web Technologies",i:["HTML","CSS","JavaScript"],d:"Core technologies for building web interfaces."}
];

const PROJECTS=[
 {n:"Q-link Pharma",s:"AI & Quantum-inspired Drug Distribution Optimizer",d:"Jul 2026 – Present",
  sum:"An intelligent drug distribution platform for medicine demand forecasting and supply optimization.",
  pts:["Developed an intelligent drug distribution platform for medicine demand forecasting and supply optimization.","Implemented LSTM with Self-Attention and quantum-inspired QUBO optimization using the D-Wave Ocean SDK.","Built backend services using FastAPI and integrated them with a React.js dashboard."],
  st:["Python","FastAPI","PyTorch","PostgreSQL","React.js","D-Wave Ocean SDK"]},
 {n:"Bill Decoder",s:"AI-powered government bill simplifier",d:"Mar 2026 – Apr 2026",
  sum:"A web application that turns government bills into easy-to-understand summaries and visual insights.",
  pts:["Developed an AI-powered web application to simplify government bills into easy-to-understand summaries and visual insights.","Implemented OCR-based document processing and AI analysis to identify stakeholder impact, costs, risks, and policy highlights.","Integrated AI using the Groq API to analyze documents and generate structured summaries."],
  st:["Python","Flask","Tesseract OCR","pdfplumber","Groq API"]},
 {n:"Stitch It Up",s:"Tailor Management System",d:"Mar 2025 – Apr 2025",
  sum:"A full-stack web app for a custom tailoring service with secure user authentication and order management.",
  pts:["Built a full-stack web app for a custom tailoring service with secure user authentication and order management.","Added clothing customization, order placement, tracking, and order history features.","Developed RESTful APIs for user and order operations and integrated MySQL for data storage."],
  st:["Node.js","Express","MySQL","HTML","CSS","JavaScript"]}
];

const CERTS=[
 {t:"AWS Prompt Engineering",o:"Amazon Web Services",dt:"July 2026",d:"Covers prompt engineering techniques."},
 {t:"AWS Certified Cloud Practitioner",o:"Amazon Web Services",dt:"July 2026",d:"Covers cloud computing basics and AWS services."},
 {t:"Power BI For Beginners",o:"",dt:"April 2026",d:"Covers DAX, dashboards and visualization."},
 {t:"Introduction to Data Analytics",o:"SkillUp",dt:"Feb 2026",d:"Covers data visualization, dashboard creation, DAX and data analysis."},
 {t:"Python Course For Beginners",o:"Scaler",dt:"Jan 2026",d:"Covers the concepts of Python."}
];

function useReveal(){
  const r=useRef();
  useEffect(()=>{
    const el=r.current;if(!el)return;
    const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add("in");io.disconnect()}},{threshold:.12});
    io.observe(el);return()=>io.disconnect();
  },[]);
  return r;
}

function Section({id,title,sub,children}){
  const r=useReveal();
  return html`<section id=${id}><div class="wrap rv" ref=${r}>
    <div class="head"><h2>${title}</h2>${sub&&html`<p>${sub}</p>`}<i></i></div>${children}</div></section>`;
}

function Typed(){
  const [txt,setTxt]=useState("");
  useEffect(()=>{
    let w=0,c=0,del=false,t;
    const tick=()=>{
      const word=ROLES[w];
      c+=del?-1:1;setTxt(word.slice(0,c));
      let ms=del?30:70;
      if(!del&&c===word.length){del=true;ms=1600}
      else if(del&&c===0){del=false;w=(w+1)%ROLES.length;ms=350}
      t=setTimeout(tick,ms);
    };
    tick();return()=>clearTimeout(t);
  },[]);
  return html`<div class="role grad">${txt}<span class="cur"></span></div>`;
}

function Nav(){
  const [sc,setSc]=useState(false),[act,setAct]=useState("Home"),[m,setM]=useState(false);
  useEffect(()=>{
    const f=()=>{
      setSc(window.scrollY>30);
      let cur="Home";
      NAV.forEach(n=>{const e=document.getElementById(n.toLowerCase());if(e&&e.getBoundingClientRect().top<160)cur=n});
      setAct(cur);
    };
    f();window.addEventListener("scroll",f,{passive:true});return()=>window.removeEventListener("scroll",f);
  },[]);
  return html`<nav class=${"nav"+(sc?" s":"")}><div class="wrap">
    <a class="logo" href="#home">Samruddhi K.</a>
    <button class="burger" aria-label="Menu" onClick=${()=>setM(!m)}>${m?"✕":"☰"}</button>
    <div class=${"links"+(m?" m":"")}>${NAV.map(n=>html`<a key=${n} href=${"#"+n.toLowerCase()} class=${act===n?"on":""} onClick=${()=>setM(false)}>${n}</a>`)}</div>
  </div></nav>`;
}

function Hero(){
  return html`<section class="hero" id="home" style=${{padding:"110px 0 60px"}}><div class="wrap">
    <div>
      <div class="hi">Hello, I’m</div>
      <h1>Samruddhi <span class="grad">Kapadnis</span></h1>
      <${Typed}/>
      <p class="lead">I build AI-powered projects across machine learning, data analytics and full-stack web development, and I’m looking to grow as an entry-level professional.</p>
      <div class="btns">
        <a class="btn p" href="#projects">View projects</a>
        <a class="btn" href="#contact">Get in touch</a>
        <a class="btn" href=${GITHUB} target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
    <div class="avatar"><span class="grad">SK</span></div>
  </div></section>`;
}

function About(){
  return html`<${Section} id="about" title="About me">
    <div class="about">
      <div class="glass"><h3>Who I am</h3>
        <p>Artificial Intelligence & Data Science undergraduate with interests in software development, data analytics, and cloud computing. Eager to apply my technical knowledge, contribute to meaningful projects, and grow as an entry-level professional.</p></div>
      <div class="glass"><h3>Beyond the classroom</h3>
        <ul class="ul">
          <li>Secured 1st place in the Elocution Competition at Maffick 2026, KKWIEER, Nashik.</li>
          <li>Participated in the Buildathon Hackathon (Guru Gobind Singh College, Nashik).</li>
          <li>Completed three editions of Prompt Quest, enhancing prompt engineering skills.</li>
          <li>Attended Flash AI organized by the Debuggers Club, KKWIEER, Nashik.</li>
        </ul></div>
      <div class="glass" style=${{padding:"32px",gridColumn:"1 / -1"}}><h3 style=${{marginBottom:"14px",fontSize:"1.15rem"}}>Languages</h3>
        <div class="tags" style=${{marginTop:0}}>
          <span class="tag">English · Professional Proficiency</span><span class="tag">Hindi · Fluent</span><span class="tag">Marathi · Native</span></div></div>
    </div></${Section}>`;
}

function Skills(){
  const [o,setO]=useState(null);
  return html`<${Section} id="skills" title="Skills" sub="Tap a card to see what’s inside.">
    <div class="grid">${SKILLS.map((s,i)=>html`
      <button key=${s.t} class=${"glass hv card"+(o===i?" open":"")} aria-expanded=${o===i} onClick=${()=>setO(o===i?null:i)}>
        <div class="ch"><h3>${s.t}</h3><span class="plus">+</span></div>
        <div class="exp"><div><p>${s.d}</p></div></div>
        <div class="tags">${s.i.map(x=>html`<span class="tag" key=${x}>${x}</span>`)}</div>
      </button>`)}</div></${Section}>`;
}

function Projects({onOpen}){
  return html`<${Section} id="projects" title="Projects" sub="Select a project to read the details.">
    <div class="grid">${PROJECTS.map((p,i)=>html`
      <button key=${p.n} class="glass hv card pc" onClick=${()=>onOpen(p)}>
        <span class="date">${p.d}</span>
        <h3>${p.n}</h3>
        <div class="sub" style=${{marginTop:"-4px",marginBottom:"10px"}}>${p.s}</div>
        <p>${p.sum}</p>
        <div class="tags">${p.st.slice(0,4).map(x=>html`<span class="tag" key=${x}>${x}</span>`)}</div>
        <div class="more">View details →</div>
      </button>`)}</div></${Section}>`;
}

function Education(){
  return html`<${Section} id="education" title="Education">
    <div class="glass hv edu"><div class="cap">🎓</div>
      <div><h3>B.Tech in Artificial Intelligence & Data Science</h3>
        <p>KK Wagh College of Engineering Education & Research, Nashik</p>
        <div class="tags"><span class="tag">2023 – Present</span></div></div></div></${Section}>`;
}

function Certs(){
  const [o,setO]=useState(null);
  return html`<${Section} id="certifications" title="Certifications" sub="Tap a card to see what each one covers.">
    <div class="grid">${CERTS.map((c,i)=>html`
      <button key=${c.t} class=${"glass hv card"+(o===i?" open":"")} aria-expanded=${o===i} onClick=${()=>setO(o===i?null:i)}>
        <div class="ch"><h3>${c.t}</h3><span class="plus">+</span></div>
        <div class="sub">${[c.o,c.dt].filter(Boolean).join(" · ")}</div>
        <div class="exp"><div><p>${c.d}</p></div></div>
      </button>`)}</div></${Section}>`;
}

function Contact(){
  const items=[["✉","Email",EMAIL,"mailto:"+EMAIL],["GH","GitHub","github.com/Samruddhi241",GITHUB],["in","LinkedIn","linkedin.com/in/samruddhi-kapadnis-2b1128296",LINKEDIN]];
  return html`<${Section} id="contact" title="Contact" sub="Open to entry-level opportunities. Reach out through any channel below.">
    <div class="contact">${items.map(([ic,t,v,h])=>html`
      <a key=${t} class="glass hv ct" href=${h} target=${t==="Email"?"_self":"_blank"} rel="noopener">
        <div class="ci">${ic}</div><b>${t}</b><span>${v}</span></a>`)}</div></${Section}>`;
}

function Modal({p,onClose}){
  useEffect(()=>{
    const k=e=>e.key==="Escape"&&onClose();
    document.addEventListener("keydown",k);document.body.style.overflow="hidden";
    return()=>{document.removeEventListener("keydown",k);document.body.style.overflow=""};
  },[]);
  return html`<div class="ov" onClick=${onClose}>
    <div class="glass md" role="dialog" aria-modal="true" onClick=${e=>e.stopPropagation()}>
      <button class="x" aria-label="Close" onClick=${onClose}>✕</button>
      <span class="date">${p.d}</span>
      <h3>${p.n}</h3><div class="sub">${p.s}</div>
      <h4>What I did</h4>
      <ul class="ul">${p.pts.map(x=>html`<li key=${x}>${x}</li>`)}</ul>
      <h4>Tech stack</h4>
      <div class="tags" style=${{marginTop:0}}>${p.st.map(x=>html`<span class="tag" key=${x}>${x}</span>`)}</div>
    </div></div>`;
}

function App(){
  const [p,setP]=useState(null);
  return html`<${React.Fragment}>
    <${Nav}/><${Hero}/><${About}/><${Skills}/><${Projects} onOpen=${setP}/><${Education}/><${Certs}/><${Contact}/>
    <footer>© 2026 Samruddhi Kapadnis</footer>
    ${p&&html`<${Modal} p=${p} onClose=${()=>setP(null)}/>`}
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
